name: CI
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions SHA-pinned (supply-chain hygiene) — SHAs resolve to the tags noted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 — reads packageManager

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22          # 20 is EOL since 2026-04-30
          cache: pnpm               # needs the committed pnpm-lock.yaml (landed v0.1.1)

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          # Block style on purpose — a flow map here ({ components: clippy, rustfmt })
          # parsed `rustfmt` as a separate bogus input key and only ever requested clippy.
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: src-tauri }   # Cargo.toml lives in src-tauri, not repo root

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Frontend install + build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Rust formatting
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Tests
        run: cargo test
        working-directory: src-tauri

      - name: Debug shell build (no bundling — fast)
        run: pnpm tauri build --debug --no-bundle
