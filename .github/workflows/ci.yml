name: CI
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4        # reads packageManager from package.json

      # no cache: pnpm here — requires a committed pnpm-lock.yaml (add at M1)
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Frontend install + build
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Rust formatting
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Tests
        run: cargo test
        working-directory: src-tauri

      - name: Debug shell build (no bundling — fast)
        run: pnpm tauri build --debug --no-bundle
