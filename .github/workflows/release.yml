name: Release
on:
  push: { tags: ["v*"] }
permissions: { contents: write }

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      # Actions SHA-pinned (supply-chain hygiene) — SHAs resolve to the tags noted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4 — reads packageManager

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22          # 20 is EOL since 2026-04-30
          cache: pnpm               # needs the committed pnpm-lock.yaml (landed v0.1.1)

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: src-tauri }   # Cargo.toml lives in src-tauri, not repo root

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      # ── M4 (signing) — uncomment when the secrets exist ──────────────────
      # macOS: Developer ID + notarization
      # - name: Import Apple certificate + notary profile
      #   if: runner.os == 'macOS'
      #   env:
      #     APPLE_CERTIFICATE_P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12_B64 }}
      #     APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #   run: |
      #     echo "$APPLE_CERTIFICATE_P12_B64" | base64 --decode > /tmp/cert.p12
      #     security create-keychain -p pwd build.keychain
      #     security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple: -s -k pwd build.keychain
      #     security default-keychain -s build.keychain
      #     xcrun notarytool store-credentials AMTA_NOTARY \
      #       --apple-id "${{ secrets.APPLE_ID }}" \
      #       --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
      #       --team-id "${{ secrets.APPLE_TEAM_ID }}"
      # Windows: add AZURE_* (Trusted Signing) envs to the tauri-action step below.
      # ─────────────────────────────────────────────────────────────────────

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build + attach installers to the draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0 line — move to action-v1.0.0 at M1 (updater: .app.tar.gz naming + latest.json URLs change)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # M1 (auto-updater): add TAURI_SIGNING_PRIVATE_KEY / _PASSWORD secrets
          # and set bundle.createUpdaterArtifacts: true in tauri.conf.json.
          # M4 (macOS signing): add APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID /
          #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD envs here.
          # M4 (Windows signing): add AZURE_CLIENT_ID / AZURE_TENANT_ID /
          #   AZURE_CLIENT_SECRET / AZURE_SIGNING_ACCOUNT_NAME /
          #   AZURE_SIGNING_CERT_PROFILE envs here.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AMTA Companion ${{ github.ref_name }}"
          releaseBody: "Installers for Windows (.msi/.exe), macOS (.dmg, universal Intel+Apple Silicon) and Linux (.AppImage/.deb/.rpm). Unsigned build — see README for the first-launch bypass on macOS/Windows."
          releaseDraft: true        # QA the draft, then press Publish
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          args: ${{ matrix.args }}
