[package]
name = "amta-companion"
version = "0.1.0"
description = "AMTA Lexicography Assistant — local companion app (Option C)"
authors = ["Waleed Mandour"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
